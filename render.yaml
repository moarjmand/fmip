# The public preview (T-086, D-064).
#
# Render builds `deploy/preview/Dockerfile` from this repository and runs it, so
# there is no image to push and nothing here holds a credential: the one secret
# is marked `sync: false`, which means Render asks the maintainer for it and
# never stores it in git; the other is generated by Render and never seen by
# anybody.
#
# The database is deliberately not defined here. Render's own free Postgres is
# deleted after 30 days, and a preview that dies on a schedule is worse than no
# preview -- it fails silently, weeks later, for a reason nobody remembers. So
# the database is a Neon free project, permanent, and supplied as DATABASE_URL.
#
# What this preview does not have, and says so rather than faking it (rule 3):
# no model service (`MODEL_SERVICE_URL=off`, every forecast recorded
# `model_unreachable`), no Redis (`GET /health/chat` reports the bus `absent`),
# no scheduler (`INGESTION_SCHEDULE=off`, the data is whatever the database
# holds). Each `off` is a statement; omitting the variable still refuses to boot.
#
# Runbook: docs/11-preview.md
services:
  - type: web
    name: fmip-preview
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./deploy/preview/Dockerfile
    dockerContext: .
    # `/en` renders through the API, so a healthy answer here means both
    # processes are up -- which is the only state this image is willing to serve
    # in (`start.mjs` takes the container down if either half dies).
    healthCheckPath: /en
    envVars:
      # Neon. Asked for once, on the first deploy, and never written down here.
      - key: DATABASE_URL
        sync: false
      # Nobody needs to know this one, so nobody is told it.
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Stated rather than detected. `start.mjs` reads PORT and the web app
      # binds it; the API stays on 127.0.0.1 and is not published.
      - key: PORT
        value: '8000'
      - key: API_PORT
        value: '3001'
      - key: API_BASE_URL
        value: http://127.0.0.1:3001
      - key: MODEL_SERVICE_URL
        value: 'off'
      - key: INGESTION_SOURCE
        value: 'off'
      - key: INGESTION_SCHEDULE
        value: 'off'
      - key: RUN_MIGRATIONS
        value: 'on'
      # Development fixture data, off by default. Turning it on says in the log
      # that what follows is not product data.
      - key: PREVIEW_SEED
        value: 'off'
      # SITE_URL and WEB_BASE_URL are not set here on purpose: `start.mjs` takes
      # them from the address Render assigns, so the preview's canonical links,
      # sitemap, manifest and e-mails name an address that can actually be
      # opened. Set them explicitly to override.
