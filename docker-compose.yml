# Local development stack.
#
#   cp .env.example .env
#   docker compose up -d
#
# Postgres, Redis, the API and the web app. The model service joins this file
# in T-063.
#
# Published ports are bound to 127.0.0.1 on purpose: a development database
# should not be reachable from the rest of the network.

name: fmip

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env — copy .env.example first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env — copy .env.example first}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env — copy .env.example first}
      # Explicit PGDATA under the mount point. The official image has moved its
      # default data directory between major versions; pinning it here means a
      # major upgrade cannot silently start writing outside the volume.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Checksums must be enabled at initdb time. They cannot be turned on later
      # without a dump and reload.
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Redis holds live match state and the BullMQ queues (D-010, and the job
    # runner in T-026). Losing a queue on restart means losing scheduled
    # ingestion work, so persistence is on: an append-only log, plus an RDB
    # snapshot after 60s if at least one key changed.
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      # Built from the service names, NOT from DATABASE_URL/REDIS_URL in .env:
      # those point at localhost, which inside this container is this container.
      # Deriving them here also means there is one less pair of values to keep
      # in sync by hand.
      #
      # Nothing reads either variable yet — the database and Redis clients
      # arrive in T-008. They are wired now because this is the point where the
      # localhost trap is easy to get wrong and hard to notice later.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No curl or wget in the node:alpine runtime image, and adding one to a
      # production image only for a healthcheck is not worth it.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # NODE_ENV is deliberately not passed through from .env: the image runs a
      # production build, and handing it `development` would put Next into a
      # mode the build does not match.
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-side rendering calls the API over the compose network. The value
      # in .env points at localhost, which inside this container is this
      # container.
      API_BASE_URL: http://api:3001
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/en').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
