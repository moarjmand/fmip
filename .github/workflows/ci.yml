name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded pull request run is wasted compute. Runs on main are never
# cancelled: main's history must keep a verdict for every commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres, so the store tests in apps/api run here instead of being
    # skipped (D-025). Same image as docker-compose.yml; throwaway credentials
    # because the database lives exactly as long as the job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fmip
          POSTGRES_PASSWORD: fmip
          POSTGRES_DB: fmip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmip -d fmip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://fmip:fmip@localhost:5432/fmip

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Corepack takes the pnpm version from the `packageManager` field in
      # package.json, so CI and a developer machine cannot drift apart.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # The model service is Python (D-009). Its Turbo scripts run `python`
      # from PATH when there is no venv, so installing the package into the
      # runner's interpreter is all `pnpm lint/typecheck/test` need.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/model/pyproject.toml

      - name: Install the model service
        id: model
        run: python -m pip install --quiet -e 'apps/model[dev]'

      # Every check below runs even when an earlier one failed, so a single run
      # reports everything that needs fixing rather than one thing at a time.
      # They are skipped only if the install itself failed, where every result
      # would be noise.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.model.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.model.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.model.outcome == 'success' }}
        run: pnpm typecheck

      # The schema the tests run against is the one the migrations produce, and
      # the seed is what the resolver's integration tests resolve against. Both
      # run through the real package scripts, so a migration that node-pg-migrate
      # cannot apply fails CI here, not on a developer's machine.
      - name: Migrate and seed
        id: database
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.model.outcome == 'success' }}
        run: |
          pnpm --filter @fmip/db build
          pnpm --filter @fmip/db migrate:up
          pnpm --filter @fmip/db seed

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.database.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.model.outcome == 'success' }}
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The runner image ships an apt source for Google Chrome that nothing here
      # uses. `--with-deps` below runs `apt-get update` across every source, and
      # that one has failed with "Hash Sum mismatch" on consecutive runs, killing
      # the job before a test ran. Dropping it keeps the update to Ubuntu's own
      # archives, which is all the Chromium dependencies need.
      - name: Drop the runner's Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*

      # Only Chromium: these are layout assertions about writing direction, and
      # direction is not a place browsers disagree. A second engine would double
      # the job for no new signal.
      - name: Install Chromium for Playwright
        run: pnpm --filter @fmip/web exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter @fmip/web e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
