<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The Stadiomind mark (T-1492, D-262): three rounded bars, home, draw and
    away, the forecast bar turned into a sign, in the Design System's Night
    colours on an ink tile. The source of the favicon and the app icons: after
    an edit, run `node scripts/make-icons.mjs` and mirror the change in
    `src/components/brand-mark.tsx`. Only a full-size first rect and then
    rects and circles with hex fills: that is what the script can draw.
  -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0f1215"/>
  <rect x="14" y="16" width="36" height="8" rx="4" fill="#2bb3ad"/>
  <rect x="14" y="28" width="22" height="8" rx="4" fill="#56616b"/>
  <rect x="14" y="40" width="14" height="8" rx="4" fill="#eba53c"/>
</svg>
