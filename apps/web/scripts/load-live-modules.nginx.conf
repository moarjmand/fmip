# A stand-in for Cloudflare in front of the web server, for the live modules'
# load test (T-1829, D-422): it keeps a 200 answer for as long as the origin's
# Cache-Control says (max-age=2) and passes everything else through. No cache
# lock: concurrent misses each reach the origin, as without Cloudflare's
# request collapsing -- the conservative case.
proxy_cache_path /var/cache/nginx/live levels=1:2 keys_zone=live:10m max_size=100m inactive=30s use_temp_path=off;

server {
  listen 80;
  location / {
    proxy_pass http://host.docker.internal:3958;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache live;
    proxy_cache_key $scheme$host$request_uri$http_accept_encoding;
    proxy_cache_lock off;
    add_header X-Cache $upstream_cache_status always;
  }
}
