[project]
name = "fmip-model"
version = "0.0.0"
description = "FMIP forecast model service: training-store loaders, the score model, backtesting, and the FastAPI contract."
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fmip_model*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["fmip_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
